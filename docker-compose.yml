
services:
  # 1. Backend (FastAPI)
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: predictive_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api          # Hot-reload for the API layer
      - ./src:/app/src          # Hot-reload for core ML logic
      - ./models:/app/models
      - ./data:/app/data
      - ./configs:/app/configs
    # Override default command to enable Uvicorn hot-reload in development
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # 2. Frontend (Streamlit)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: predictive_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app          # Hot-reload for Streamlit dashboard
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    # Override default command to force file watching via polling
    command: streamlit run app/streamlit_app.py --server.runOnSave true --server.fileWatcherType poll